<!doctype html>
<html lang="nl-BE" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101418" />
    <meta name="description" content="Be Strong — Stronger than yesterday." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Be Strong" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg?v=2" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png?v=2" />
    <!-- Geen witte flits: meteen donkere achtergrond, en het gekozen thema vóór de eerste render. -->
    <style>
      html,
      body {
        background: #101418;
        color: #fbf6ee;
      }
    </style>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('bestrong-theme') || 'dark';
          var root = document.documentElement;
          if (t === 'auto') root.removeAttribute('data-theme');
          else root.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
          var light = t === 'light' || (t === 'auto' && window.matchMedia('(prefers-color-scheme: light)').matches);
          if (light) {
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#F6F1E8');
            document.write('<style>html,body{background:#F6F1E8;color:#101418}</style>');
          }
        } catch (e) {}
      })();
    </script>
    <title>Be Strong</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
